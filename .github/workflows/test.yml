name: Test

on: 
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login to dockerhub if not a fork PR and not dependabot
      - name: Login Dockerhub
        if: ${{ github.actor != 'dependabot[bot]' && (github.event.pull_request == null || !github.event.pull_request.head.repo.fork) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: voidauth
          password: ${{ secrets.DOCKER_TOKEN }}

      # Login to docker hardened image registry if not a fork PR and not dependabot
      - name: Login Docker Hardened Images Registry
        if: ${{ github.actor != 'dependabot[bot]' && (github.event.pull_request == null || !github.event.pull_request.head.repo.fork) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: dhi.io
          username: voidauth
          password: ${{ secrets.DOCKER_TOKEN }}

      # runs for PRs from forks or dependabot (skip any registry-backed cache)
      - name: Build Push (fork/dependabot - no remote cache)
        if: ${{ github.actor == 'dependabot[bot]' || (github.event.pull_request != null && github.event.pull_request.head.repo.fork) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-build-fork
        with:
          context: .
          file: Dockerfile
          target: build
          platforms: linux/amd64,linux/arm64
          tags: voidauth/voidauth:test
          push: false
          cache-from: |
            type=gha
            type=registry,ref=voidauth/voidauth:latest
            type=registry,ref=voidauth/voidauth:edge

      # runs for PRs from the same repo (or non-PR runs) and uses registry cache
      - name: Build Push (with registry cache)
        if: ${{ github.actor != 'dependabot[bot]' && (github.event.pull_request == null || !github.event.pull_request.head.repo.fork) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: voidauth/voidauth:test
          push: false
          cache-from: |
            type=gha
            type=registry,ref=voidauth/voidauth-cache:test
            type=registry,ref=voidauth/voidauth-cache:release
            type=registry,ref=voidauth/voidauth:latest
            type=registry,ref=voidauth/voidauth:edge
          cache-to: type=registry,mode=max,ref=voidauth/voidauth-cache:test

  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Test (sqlite)
        run: npm test
        env:
          DB_ADAPTER: sqlite

      - name: Test (postgres)
        run: npm test
        env:
          DB_ADAPTER: postgres
          DB_HOST: localhost
