name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: 
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Login GitHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: notquitenothing
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Docker Hardened Images Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: notquitenothing
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: DOCKER_IMAGE_NAME
        run: |
          DOCKER_IMAGE_NAME="voidauth/voidauth"
          # Make DOCKER_IMAGE_NAME accessible in other steps
          echo "DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}" >>${GITHUB_ENV}
          
      - name: Docker Metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ${{ env.DOCKER_IMAGE_NAME }}
            ghcr.io/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge
            # set edge tag if manual run
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Docker QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: docker-build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          push: true
          cache-from: |
            type=registry,ref=voidauth/voidauth-cache:test
            type=registry,ref=voidauth/voidauth-cache:release
            type=registry,ref=voidauth/voidauth:latest
            type=registry,ref=voidauth/voidauth:edge
          cache-to: type=registry,mode=max,ref=voidauth/voidauth-cache:release

      - name: Docker Hub Description Update
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: notquitenothing
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_IMAGE_NAME }}
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
