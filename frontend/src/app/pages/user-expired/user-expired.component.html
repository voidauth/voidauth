<span style="flex-grow: 1"></span>
<mat-card class="form-card info-only">
  <mat-card-content>
    <h1>{{ "user-expired.title" | translate }}</h1>
    <p style="text-align: center">{{ "user-expired.content" | translate }}</p>
    <mat-card-actions>
      <a mat-button routerLink="/login">{{ "user-expired.actions.login" | translate }}</a>
      <button mat-flat-button (click)="tryAgain()">{{ "user-expired.actions.try-again" | translate }}</button>
    </mat-card-actions>
  </mat-card-content>
</mat-card>

<span style="flex-grow: 1"></span>

@if (config?.contactEmail; as contactEmail) {
  <a class="contact" matButton="elevated" [href]="'mailto:' + contactEmail">{{ "contact-us.actions.label" | translate }}</a>
}
